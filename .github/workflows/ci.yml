name: CI

# Only the Feishu agent is built and deployed from this repo. The inherited Pi
# packages are kept as reference, and building them here fails: `packages/ai`
# regenerates its model catalog from live provider APIs at build time, and those
# catalogs have moved on since this fork was taken.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  feishu-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts skips the native builds the other packages would need,
      # which is why no system libraries are installed here.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npx tsc -p packages/feishu-knowledge-agent/tsconfig.build.json --noEmit

      - name: Lint and format
        run: npx biome check packages/feishu-knowledge-agent/src
